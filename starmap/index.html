<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Starmap — The Mandala Oracle</title>
<meta name="description" content="The navigable starmap of the Mandala Oracle: a knowledge graph whose nodes are stars. Canon texts seated on HYG stars within the zodiacal regions of the Dodecad; the Septad substrate-spine; theory-constellations; casts as novae.">
<style>
  :root { --gold:#e8c76a; --gold-dim:#a08a4a; --ink:#dfe6f0; --dim:#7b86a0; --panel:#0b1020ee; --line:#2a3350; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#04060f; color:var(--ink); font:14px/1.45 Georgia,'Times New Roman',serif; overflow:hidden; }
  #sky { position:fixed; inset:0; display:block; cursor:grab; touch-action:none; }
  #sky.dragging { cursor:grabbing; }
  .hud { position:fixed; z-index:5; }
  #title { top:14px; left:16px; pointer-events:none; }
  #title h1 { font-size:19px; letter-spacing:.22em; color:var(--gold); font-weight:normal; }
  #title .sub { font-size:11px; color:var(--dim); letter-spacing:.12em; margin-top:2px; }
  #layers { bottom:14px; left:16px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; backdrop-filter:blur(4px); }
  #layers label { display:inline-flex; align-items:center; gap:5px; margin:2px 10px 2px 0; font-size:11.5px; color:var(--dim); cursor:pointer; letter-spacing:.05em; user-select:none; }
  #layers input { accent-color:var(--gold); }
  #layers label.on { color:var(--ink); }
  #back { bottom:14px; right:16px; font-size:12px; color:var(--dim); text-decoration:none; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 12px; }
  #back:hover { color:var(--gold); }
  #panel { top:0; right:0; height:100%; width:min(360px,92vw); background:var(--panel); border-left:1px solid var(--line); padding:20px 18px 26px; overflow-y:auto; transform:translateX(105%); transition:transform .22s ease; backdrop-filter:blur(6px); }
  #panel.open { transform:none; }
  #panel .close { position:absolute; top:10px; right:12px; background:none; border:none; color:var(--dim); font-size:20px; cursor:pointer; }
  #panel h2 { font-size:16px; color:var(--gold); font-weight:normal; margin:6px 0 2px; line-height:1.3; }
  #panel .kind { font-size:10.5px; letter-spacing:.18em; color:var(--dim); text-transform:uppercase; }
  #panel .row { margin:9px 0; font-size:12.5px; color:var(--ink); }
  #panel .row b { color:var(--dim); font-weight:normal; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; display:block; }
  #panel .links { margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  #panel .links a { color:var(--gold); text-decoration:none; font-size:13px; border:1px solid var(--line); border-radius:6px; padding:7px 10px; }
  #panel .links a:hover { border-color:var(--gold-dim); }
  #tip { position:fixed; z-index:6; pointer-events:none; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 9px; font-size:11.5px; color:var(--ink); max-width:260px; display:none; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); letter-spacing:.3em; font-size:12px; z-index:9; background:#04060f; transition:opacity .5s; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="hud" id="title"><h1>THE STARMAP</h1><div class="sub">THE MANDALA ORACLE · CANON IN SKY</div></div>
<div class="hud" id="layers"></div>
<a class="hud" id="back" href="/">← The Reading Surface</a>
<div class="hud" id="panel"><button class="close" onclick="panel.classList.remove('open')">×</button><div id="panelBody"></div></div>
<div id="tip"></div>
<div id="loading">ASSEMBLING THE SKY</div>
<script>
(async function(){
'use strict';
const cv = document.getElementById('sky'), cx = cv.getContext('2d');
const panel = document.getElementById('panel'), panelBody = document.getElementById('panelBody');
const tip = document.getElementById('tip');
window.panel = panel;
let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
function resize(){ W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; cx.setTransform(DPR,0,0,DPR,0,0); dirty=true; }
addEventListener('resize', resize);

// ── Data ─────────────────────────────────────────────
const [stars, zodiacDoc, canonDoc, subDoc, edgeDoc, figDoc, evDoc] = await Promise.all([
  fetch('/sky/stars.json').then(r=>r.json()),
  fetch('/sky/zodiac.json').then(r=>r.json()),
  fetch('/data/canon-sky/canon-stars.json').then(r=>r.json()),
  fetch('/data/canon-sky/substrates.json').then(r=>r.json()),
  fetch('/data/canon-sky/canon-edges.json').then(r=>r.json()).catch(()=>({edges:[]})),
  fetch('/sky/theory-constellations.json').then(r=>r.json()).catch(()=>({figures:[]})),
  fetch('/sky/events.json').then(r=>r.json()).catch(()=>({events:[]})),
]);
const zodiac = zodiacDoc.zodiac||[];
const canon = (canonDoc.canonical_texts||[]).filter(t=>t.target_star_designation);
const canonById = Object.fromEntries(canon.map(t=>[t.id,t]));
const substrates = subDoc.substrates||[];
const edges = (edgeDoc.edges||edgeDoc||[]).filter(e=>canonById[e.source]&&canonById[e.target]);
const figures = figDoc.figures||[];
const events = (evDoc.events||[]);
const polaris = stars.find(s=>s.name==='Polaris') || {ra:2.53,dec:89.26,mag:1.97};

// ── Projection: equirectangular, RA increases leftward (sky convention) ──
let zoom = 1.0, panX = 0, panY = 0, dirty = true;
const BASE = () => Math.max(W, H*2); // world width at zoom 1
function worldW(){ return BASE()*zoom; }
function worldH(){ return worldW()/2; }
function proj(ra, dec){
  const ww = worldW(), wh = worldH();
  let x = ((24 - (ra%24))/24)*ww + panX;
  const y = ((90-dec)/180)*wh + panY + (H-wh)/2;
  return [x, y, ww];
}
function wrapped(x, ww){ const out=[x]; if(x<W) out.push(x+ww); if(x>0) out.push(x-ww); return out; }

// star color from B-V index
function ciColor(ci){ if(ci==null) return '#cdd6ea';
  if(ci< 0.0) return '#aabfff'; if(ci<0.3) return '#cfd8ff'; if(ci<0.6) return '#eef0ff';
  if(ci<0.9) return '#fff4e0'; if(ci<1.3) return '#ffd9a0'; return '#ffb070'; }

// ── Layers ──────────────────────────────────────────
const LAYERS = [ ['stars','Stars',true], ['band','Zodiacal Band',true], ['spine','Substrate Spine',true],
  ['canon','Canon',true], ['edges','Edges',true], ['figures','Figures',true], ['novae','Novae',true] ];
const L = {}; const layersEl = document.getElementById('layers');
LAYERS.forEach(([k,name,def])=>{ L[k]=def;
  const lab=document.createElement('label'); lab.className=def?'on':'';
  const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=def;
  cb.onchange=()=>{ L[k]=cb.checked; lab.className=cb.checked?'on':''; dirty=true; };
  lab.append(cb, name); layersEl.append(lab); });

// ── Spine geometry (screen-fixed) ───────────────────
function spinePositions(){
  const n=substrates.length, m=Math.min(W*0.09,86), gap=(W-2*m)/(n-1||1), y=Math.min(84,H*0.13);
  return substrates.map((s,i)=>({s, x:m+gap*i, y, r:Math.min(20, gap*0.22)}));
}
function drawPlanet(p){
  const {s,x,y,r}=p;
  const grads = {
    'Sun':      ()=>{ const g=cx.createRadialGradient(x,y,1,x,y,r*2.1); g.addColorStop(0,'#fff7d8'); g.addColorStop(.35,'#ffd76a'); g.addColorStop(1,'rgba(255,180,60,0)'); cx.fillStyle=g; cx.beginPath(); cx.arc(x,y,r*2.1,0,7); cx.fill(); },
    'Moon':     ()=>sphere('#d8dbe2','#8f93a0', ()=>{ cx.fillStyle='rgba(110,115,130,.5)'; dot(-r*.3,-r*.2,r*.28); dot(r*.25,r*.15,r*.2); dot(-r*.05,r*.35,r*.14); }),
    'Mercury':  ()=>sphere('#cfc6ba','#6f6a60'),
    'Venus':    ()=>sphere('#f4e3c0','#c9a86a'),
    'Mars':     ()=>sphere('#e8a074','#a04a2a'),
    'Jupiter':  ()=>sphere('#e8d6b8','#b08a5a', ()=>{ cx.strokeStyle='rgba(150,105,60,.55)'; cx.lineWidth=r*.16; for(const dy of [-r*.35,-r*.05,r*.3]){ cx.beginPath(); cx.ellipse(x,y+dy,r*.92,r*.16,0,0,7); cx.stroke(); } }),
    'Saturn':   ()=>{ cx.save(); cx.strokeStyle='rgba(220,200,150,.8)'; cx.lineWidth=2.4; cx.beginPath(); cx.ellipse(x,y,r*1.9,r*.55,-.35,0,7); cx.stroke(); cx.restore(); sphere('#efe0bb','#b39a62'); }
  };
  function sphere(hi,lo,extra){ const g=cx.createRadialGradient(x-r*.4,y-r*.4,r*.15,x,y,r); g.addColorStop(0,hi); g.addColorStop(1,lo); cx.fillStyle=g; cx.beginPath(); cx.arc(x,y,r,0,7); cx.fill(); if(extra){ cx.save(); cx.beginPath(); cx.arc(x,y,r,0,7); cx.clip(); extra(); cx.restore(); } }
  function dot(dx,dy,rr){ cx.beginPath(); cx.arc(x+dx,y+dy,rr,0,7); cx.fill(); }
  (grads[s.planet]||(()=>sphere('#ccc','#777')))();
  cx.textAlign='center'; cx.fillStyle='#dfe6f0'; cx.font='10px Georgia'; cx.fillText(s.symbol+' '+s.office, x, y+r+14);
  cx.fillStyle='#7b86a0'; cx.font='9px Georgia'; cx.fillText(s.substrate, x, y+r+26);
}

// ── Main draw ───────────────────────────────────────
let novaPhase = 0;
function draw(){
  cx.clearRect(0,0,W,H);
  // deep-space gradient
  const bg=cx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#050912'); bg.addColorStop(1,'#03040a');
  cx.fillStyle=bg; cx.fillRect(0,0,W,H);

  // background HYG stars
  if(L.stars){ const magCut = 5.2 + Math.log2(zoom)*0.8;
    for(const s of stars){ if(s.mag>magCut) continue;
      const [x,y,ww]=proj(s.ra,s.dec); if(y<-8||y>H+8) continue;
      const r = Math.max(.4, 2.4 - s.mag*0.42) * (0.85+0.15*zoom);
      const a = Math.max(.18, Math.min(1, 1.25 - s.mag*0.17));
      cx.fillStyle=ciColor(s.ci); cx.globalAlpha=a;
      for(const wx of wrapped(x,ww)){ if(wx<-6||wx>W+6) continue; cx.beginPath(); cx.arc(wx,y,r,0,7); cx.fill(); }
    } cx.globalAlpha=1; }

  // zodiacal band
  if(L.band){ for(const rgn of zodiac){
      const [x,y,ww]=proj(rgn.ra_center_hours, rgn.dec_center_degrees);
      for(const wx of wrapped(x,ww)){ if(wx<-160||wx>W+160) continue;
        cx.strokeStyle='rgba(160,138,74,.28)'; cx.lineWidth=1;
        cx.strokeRect(wx-70*zoom, y-46*zoom, 140*zoom, 92*zoom);
        cx.textAlign='center';
        cx.fillStyle='rgba(232,199,106,.9)'; cx.font=(15+3*zoom)+'px Georgia';
        cx.fillText(rgn.symbol+' '+rgn.sign, wx, y-46*zoom-8);
        cx.fillStyle='#aab4cc'; cx.font='11px Georgia';
        cx.fillText(rgn.heteronym, wx, y+46*zoom+15);
        if(zoom>1.5){ cx.fillStyle='#7b86a0'; cx.font='9.5px Georgia';
          wrapText(rgn.discipline||'', wx, y+46*zoom+28, 150, 11); }
      } }
    // Polaris / LOGOS*
    const [px,py,ww]=proj(polaris.ra, polaris.dec);
    for(const wx of wrapped(px,ww)){ if(wx<-40||wx>W+40) continue;
      cx.fillStyle='#fff'; cx.beginPath(); cx.arc(wx,py,3.2,0,7); cx.fill();
      cx.strokeStyle='rgba(232,199,106,.5)'; cx.beginPath(); cx.arc(wx,py,7.5,0,7); cx.stroke();
      cx.textAlign='center'; cx.fillStyle='var(--gold)'; cx.fillStyle='#e8c76a'; cx.font='11px Georgia';
      cx.fillText('Jack Feist · LOGOS*', wx, py-13);
      cx.fillStyle='#7b86a0'; cx.font='9px Georgia'; cx.fillText('the pole that makes the cycle a cycle', wx, py+20); } }

  // figures (theory constellations)
  if(L.figures){ for(const f of figures){ const pts=(f.member_texts||[]).map(id=>canonById[id]).filter(Boolean)
        .map(t=>proj(t.target_star_designation.ra, t.target_star_designation.dec));
      cx.setLineDash(f.status==='sealed'?[]:[5,5]);
      cx.strokeStyle = f.status==='sealed' ? 'rgba(232,199,106,.55)' : 'rgba(160,138,74,.4)'; cx.lineWidth=1.1;
      for(const [a,b] of (f.lines||[])){ const A=canonById[a], B=canonById[b]; if(!A||!B) continue;
        const [ax,ay,ww]=proj(A.target_star_designation.ra,A.target_star_designation.dec);
        const [bx,by]=proj(B.target_star_designation.ra,B.target_star_designation.dec);
        for(const wx of wrapped(ax,ww)){ const dx=wx-ax; if(Math.max(wx,bx+dx)<0||Math.min(wx,bx+dx)>W) continue;
          cx.beginPath(); cx.moveTo(wx,ay); cx.lineTo(bx+dx,by); cx.stroke(); } }
      cx.setLineDash([]);
      if(pts.length){ const cxm=pts.reduce((s,p)=>s+p[0],0)/pts.length, cym=pts.reduce((s,p)=>s+p[1],0)/pts.length;
        cx.textAlign='center'; cx.fillStyle='rgba(232,199,106,.75)'; cx.font='italic 12px Georgia';
        cx.fillText(f.name+(f.status!=='sealed'?' (proposed)':''), cxm, cym-10); } } }

  // edges
  if(L.edges){ const spine=spinePositions(); const mercury=spine.find(p=>p.s.planet==='Mercury');
    for(const e of edges){ const A=canonById[e.source], B=canonById[e.target];
      const [ax,ay,ww]=proj(A.target_star_designation.ra,A.target_star_designation.dec);
      const [bx,by]=proj(B.target_star_designation.ra,B.target_star_designation.dec);
      const style={companion:['rgba(207,214,234,.5)',1.1,[]],related:['rgba(123,134,160,.35)',.8,[3,4]],
        predecessor:['rgba(123,134,160,.45)',.9,[2,3]],superseded_by:['rgba(123,134,160,.22)',.8,[2,5]],
        bundle:['rgba(232,199,106,.16)',4,[]],chain_predecessor:['rgba(207,214,234,.55)',1.2,[]],
        transform_of:['rgba(232,199,106,.6)',1.2,[]]}[e.kind]||['rgba(123,134,160,.3)',.8,[3,4]];
      cx.strokeStyle=style[0]; cx.lineWidth=style[1]; cx.setLineDash(style[2]);
      for(const wx of wrapped(ax,ww)){ const dx=wx-ax; const bx2=bx+dx;
        if(Math.max(wx,bx2)<0||Math.min(wx,bx2)>W) continue;
        cx.beginPath(); cx.moveTo(wx,ay);
        if(e.kind==='transform_of'&&mercury){ cx.lineTo(mercury.x,mercury.y); }
        cx.lineTo(bx2,by); cx.stroke();
        if(e.kind==='predecessor'||e.kind==='chain_predecessor'){ arrow(wx,ay,bx2,by); } }
      cx.setLineDash([]); } }

  // canon stars
  if(L.canon){ for(const t of canon){ const d=t.target_star_designation;
      const [x,y,ww]=proj(d.ra,d.dec);
      const M=t.magnitude_class; const r = M==='primary_canon_star_M1'?5:(M==='secondary_canon_star_M2'?3.4:2.4);
      for(const wx of wrapped(x,ww)){ if(wx<-30||wx>W+30||y<-30||y>H+30) continue;
        const g=cx.createRadialGradient(wx,y,0,wx,y,r*3); g.addColorStop(0,'rgba(232,199,106,.95)'); g.addColorStop(.4,'rgba(232,199,106,.35)'); g.addColorStop(1,'rgba(232,199,106,0)');
        cx.fillStyle=g; cx.beginPath(); cx.arc(wx,y,r*3,0,7); cx.fill();
        cx.fillStyle='#fdf3d0'; cx.beginPath(); cx.arc(wx,y,r*.75,0,7); cx.fill();
        const show = M==='primary_canon_star_M1' || (M==='secondary_canon_star_M2'&&zoom>1.5) || zoom>2.6;
        if(show){ cx.textAlign='center'; cx.fillStyle='rgba(232,199,106,.92)'; cx.font=(M==='primary_canon_star_M1'?'11.5px':'10px')+' Georgia';
          cx.fillText(t.title.length>34?t.title.slice(0,32)+'…':t.title, wx, y-r-7); } } } }

  // novae
  if(L.novae){ for(const ev of events){ let ra,dec;
      const t = ev.source_text && canonById[ev.source_text];
      if(t){ ra=t.target_star_designation.ra; dec=t.target_star_designation.dec; }
      else { ra=polaris.ra; dec=polaris.dec-4; }
      const [x,y,ww]=proj(ra,dec);
      const ph = (novaPhase + (hash(ev.axn||'')%100)/100)%1;
      const rr = 5+ph*11, a = .55*(1-ph);
      for(const wx of wrapped(x,ww)){ if(wx<-20||wx>W+20) continue;
        cx.strokeStyle=`rgba(255,120,90,${a})`; cx.lineWidth=1.4;
        cx.beginPath(); cx.arc(wx,y,rr,0,7); cx.stroke();
        if(zoom>1.8&&ev.date){ cx.fillStyle='rgba(255,140,110,.7)'; cx.font='8.5px Georgia'; cx.textAlign='center';
          cx.fillText('cast · '+ev.date.slice(0,10), wx, y+rr+10); } } } }

  // spine last (screen-fixed, above sky)
  if(L.spine){ cx.fillStyle='rgba(4,6,15,.55)'; cx.fillRect(0,0,W,Math.min(84,H*.13)+44);
    for(const p of spinePositions()) drawPlanet(p); }
}
function arrow(ax,ay,bx,by){ const ang=Math.atan2(by-ay,bx-ax), mx=ax+(bx-ax)*.62, my=ay+(by-ay)*.62;
  cx.beginPath(); cx.moveTo(mx,my);
  cx.lineTo(mx-7*Math.cos(ang-.4), my-7*Math.sin(ang-.4));
  cx.moveTo(mx,my); cx.lineTo(mx-7*Math.cos(ang+.4), my-7*Math.sin(ang+.4)); cx.stroke(); }
function wrapText(txt,x,y,w,lh){ const words=(txt||'').split(' '); let line='',yy=y;
  for(const wd of words){ const test=line?line+' '+wd:wd;
    if(cx.measureText(test).width>w&&line){ cx.fillText(line,x,yy); line=wd; yy+=lh; } else line=test; }
  if(line) cx.fillText(line,x,yy); }
function hash(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); }

// ── Interaction ─────────────────────────────────────
let drag=null, pinch=null;
cv.addEventListener('pointerdown', e=>{ cv.setPointerCapture(e.pointerId);
  if(pinchPts.set(e.pointerId,[e.clientX,e.clientY]), pinchPts.size===2){ pinch=pinchDist(); drag=null; }
  else drag={x:e.clientX,y:e.clientY,moved:false}; cv.classList.add('dragging'); });
const pinchPts=new Map();
function pinchDist(){ const p=[...pinchPts.values()]; return Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]); }
cv.addEventListener('pointermove', e=>{
  if(pinchPts.has(e.pointerId)) pinchPts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinchPts.size===2&&pinch){ const d=pinchDist(); zoomAt(W/2,H/2, d/pinch); pinch=d; return; }
  if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if(Math.abs(dx)+Math.abs(dy)>3) drag.moved=true;
    panX+=dx; panY+=dy; drag.x=e.clientX; drag.y=e.clientY; dirty=true; }
  else hover(e.clientX,e.clientY); });
cv.addEventListener('pointerup', e=>{ pinchPts.delete(e.pointerId); pinch=null;
  cv.classList.remove('dragging');
  if(drag&&!drag.moved) select(e.clientX,e.clientY);
  drag=null; });
cv.addEventListener('wheel', e=>{ e.preventDefault(); zoomAt(e.clientX,e.clientY, Math.exp(-e.deltaY*0.0012)); }, {passive:false});
function zoomAt(sx,sy,f){ const nz=Math.min(14,Math.max(.5,zoom*f)); f=nz/zoom;
  panX = sx - (sx-panX)*f - ( ( (worldW()*f-worldW()) * ((sx-panX)/worldW()) ) - (sx-panX)*(f-1) );
  // simpler exact recompute:
  const wxFrac=(sx-panX)/worldW(), wyFrac=(sy-panY-(H-worldH())/2)/worldH();
  zoom=nz;
  panX = sx - wxFrac*worldW();
  panY = sy - wyFrac*worldH() - (H-worldH())/2;
  dirty=true; }

function nearestCanon(sx,sy,rad){ let best=null,bd=rad*rad;
  for(const t of canon){ const d=t.target_star_designation; const [x,y,ww]=proj(d.ra,d.dec);
    for(const wx of wrapped(x,ww)){ const dd=(wx-sx)**2+(y-sy)**2; if(dd<bd){bd=dd;best=t;} } }
  return best; }
function spineHit(sx,sy){ for(const p of spinePositions()){ if((p.x-sx)**2+(p.y-sy)**2 < (p.r+8)**2) return p.s; } return null; }
function regionHit(sx,sy){ for(const r of zodiac){ const [x,y,ww]=proj(r.ra_center_hours,r.dec_center_degrees);
    for(const wx of wrapped(x,ww)){ if(Math.abs(wx-sx)<70*zoom&&Math.abs(y-sy)<46*zoom) return r; } } return null; }

function hover(sx,sy){ const s=L.spine&&spineHit(sx,sy);
  if(s){ showTip(sx,sy, `<b style="color:#e8c76a">${s.symbol} ${s.office}</b> · ${s.substrate}<br>${(s.function||'').split('.')[0]}.`); return; }
  const t=L.canon&&nearestCanon(sx,sy,10);
  if(t){ showTip(sx,sy, `<b style="color:#e8c76a">${t.title}</b><br>${t.author_heteronym||''} · ${short(t.magnitude_class)}`); return; }
  hideTip(); }
function showTip(x,y,html){ tip.innerHTML=html; tip.style.display='block';
  tip.style.left=Math.min(x+14,W-270)+'px'; tip.style.top=Math.min(y+14,H-60)+'px'; }
function hideTip(){ tip.style.display='none'; }
function short(m){ return {primary_canon_star_M1:'M1 anchor',secondary_canon_star_M2:'M2',tertiary_canon_star_M3:'M3'}[m]||m; }

function select(sx,sy){
  const s=L.spine&&spineHit(sx,sy);
  if(s){ openPanel(`<div class="kind">Substrate · Planetary Spine</div><h2>${s.symbol} ${s.planet} — ${s.office}</h2>
    <div class="row"><b>Substrate</b>${s.substrate}</div>
    <div class="row"><b>Function</b>${s.function||''}</div>`); return; }
  const t=L.canon&&nearestCanon(sx,sy,12);
  if(t){ const d=t.target_star_designation;
    openPanel(`<div class="kind">Canon Star · ${short(t.magnitude_class)}</div><h2>${t.title}</h2>
      <div class="row"><b>Heteronym</b>${t.author_heteronym||'—'}</div>
      <div class="row"><b>Zodiacal Region</b>${t.zodiacal_region||'—'}</div>
      <div class="row"><b>Star</b>${d.name||[d.bayer,d.con].filter(Boolean).join(' ')||'—'} · RA ${d.ra.toFixed(2)}h · Dec ${d.dec.toFixed(1)}° · mag ${d.mag}</div>
      <div class="row"><b>Assignment</b>${t.sky_assignment_basis||''}</div>
      ${t.anchor_for_room?`<div class="row"><b>Room anchor</b>${t.anchor_for_room}</div>`:''}
      ${t.note?`<div class="row"><b>Note</b>${t.note}</div>`:''}
      <div class="links">
        <a href="/?sigil=${encodeURIComponent(t.id)}">Read with Sigil →</a>
        ${t.source_path?`<a href="/${t.source_path.replace(/^\//,'')}">Open source text →</a>`:''}
      </div>`); return; }
  const r=L.band&&regionHit(sx,sy);
  if(r){ openPanel(`<div class="kind">Zodiacal Region · Position ${r.position}</div><h2>${r.symbol} ${r.sign} — ${r.heteronym}</h2>
      <div class="row"><b>Discipline</b>${r.discipline||'(awaiting adjudication)'}</div>
      <div class="row"><b>Anchor star</b>${(r.anchor_star&&(r.anchor_star.name||r.anchor_star.bayer))||'—'}</div>
      <div class="row"><b>Canon here</b>${canon.filter(t=>(t.sky_assignment_basis||'').includes(r.sign)).map(t=>t.title).join(' · ')||'—'}</div>`); return; }
  panel.classList.remove('open'); }
function openPanel(html){ panelBody.innerHTML=html; panel.classList.add('open'); }

// ── Loop ────────────────────────────────────────────
resize();
// initial framing: center the zodiacal band
{ const wh=worldH(); panY = H/2 - ((90-15)/180)*wh - (H-wh)/2; }
function loop(){ if(L.novae){ novaPhase=(novaPhase+0.008)%1; dirty=true; }
  if(dirty){ draw(); dirty=false; }
  requestAnimationFrame(loop); }
document.getElementById('loading').style.opacity=0;
setTimeout(()=>document.getElementById('loading').remove(), 600);
loop();
})();
</script>
