<!DOCTYPE html>
<html lang="en">
<head>
<link rel="canonical" href="https://www.themandalaoracle.com/starmap">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Starmap — The Mandala Oracle</title>
<meta name="description" content="The navigable 3D starmap of the Mandala Oracle: a knowledge graph whose nodes are real stars. The canon seated on the HYG sphere; the Septad on the ecliptic; figures, edges, and casts as novae.">
<style>
  :root { --gold:#e8c76a; --ink:#dfe6f0; --dim:#7b86a0; --panel:#0b1020ee; --line:#2a3350; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#02030a; color:var(--ink); font:14px/1.45 Georgia,serif; overflow:hidden; }
  #sky { position:fixed; inset:0; display:block; cursor:grab; touch-action:none; }
  #sky.dragging { cursor:grabbing; }
  .hud { position:fixed; z-index:5; }
  #title { top:14px; left:16px; pointer-events:none; }
  #title h1 { font-size:18px; letter-spacing:.24em; color:var(--gold); font-weight:normal; }
  #title .sub { font-size:10.5px; color:var(--dim); letter-spacing:.14em; margin-top:2px; }
  #ctl { bottom:14px; left:16px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 11px; backdrop-filter:blur(4px); max-width:min(92vw,560px); }
  #ctl label { display:inline-flex; align-items:center; gap:5px; margin:2px 9px 2px 0; font-size:11px; color:var(--dim); cursor:pointer; letter-spacing:.04em; user-select:none; }
  #ctl label.on { color:var(--ink); }
  #ctl input[type=checkbox] { accent-color:var(--gold); }
  #dimrow { display:flex; align-items:center; gap:8px; margin-top:6px; font-size:10.5px; color:var(--dim); }
  #dim { width:150px; accent-color:var(--gold); }
  #back { bottom:14px; right:16px; font-size:12px; color:var(--dim); text-decoration:none; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 12px; }
  #back:hover { color:var(--gold); }
  #panel { top:0; right:0; height:100%; width:min(350px,92vw); background:var(--panel); border-left:1px solid var(--line); padding:20px 18px 26px; overflow-y:auto; transform:translateX(105%); transition:transform .22s ease; backdrop-filter:blur(6px); }
  #panel.open { transform:none; }
  #panel .close { position:absolute; top:10px; right:12px; background:none; border:none; color:var(--dim); font-size:20px; cursor:pointer; }
  #panel h2 { font-size:16px; color:var(--gold); font-weight:normal; margin:6px 0 2px; line-height:1.3; }
  #panel .kind { font-size:10px; letter-spacing:.18em; color:var(--dim); text-transform:uppercase; }
  #panel .row { margin:9px 0; font-size:12.5px; }
  #panel .row b { color:var(--dim); font-weight:normal; font-size:10px; letter-spacing:.1em; text-transform:uppercase; display:block; }
  #panel .links { margin-top:14px; display:flex; flex-direction:column; gap:8px; }
  #panel .links a { color:var(--gold); text-decoration:none; font-size:13px; border:1px solid var(--line); border-radius:6px; padding:7px 10px; }
  #tip { position:fixed; z-index:6; pointer-events:none; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 9px; font-size:11.5px; max-width:260px; display:none; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); letter-spacing:.3em; font-size:12px; z-index:9; background:#02030a; transition:opacity .6s; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
</head>
<body>
<canvas id="sky"></canvas>
<div class="hud" id="title"><h1>THE STARMAP</h1><div class="sub">THE MANDALA ORACLE · CANON IN SKY</div></div>
<div class="hud" id="ctl"></div>
<a class="hud" id="back" href="/">← The Reading Surface</a>
<div class="hud" id="panel"><button class="close" onclick="document.getElementById('panel').classList.remove('open')">×</button><div id="panelBody"></div></div>
<div id="tip"></div>
<div id="loading">ASSEMBLING THE SPHERE</div>
<script type="module">
import * as THREE from 'three';

const R = 1000;
const cvs = document.getElementById('sky');
const tip = document.getElementById('tip');
const panel = document.getElementById('panel'), panelBody = document.getElementById('panelBody');

const [stars, zodiacDoc, canonDoc, subDoc, edgeDoc, figDoc, evDoc] = await Promise.all([
  fetch('/sky/stars.json').then(r=>r.json()),
  fetch('/sky/zodiac.json').then(r=>r.json()),
  fetch('/data/canon-sky/canon-stars.json').then(r=>r.json()),
  fetch('/data/canon-sky/substrates.json').then(r=>r.json()),
  fetch('/data/canon-sky/canon-edges.json').then(r=>r.json()).catch(()=>({edges:[]})),
  fetch('/sky/theory-constellations.json').then(r=>r.json()).catch(()=>({figures:[]})),
  fetch('/sky/events.json').then(r=>r.json()).catch(()=>({events:[]})),
]);
const zodiac = zodiacDoc.zodiac || [];
const canon = (canonDoc.canonical_texts||[]).filter(t=>t.target_star_designation);
const canonById = Object.fromEntries(canon.map(t=>[t.id,t]));
const substrates = subDoc.substrates || [];
const edges = (edgeDoc.edges||[]).filter(e=>canonById[e.source]&&canonById[e.target]);
const figures = figDoc.figures || [];
const events = evDoc.events || [];
const polaris = stars.find(s=>s.name==='Polaris') || {ra:2.53,dec:89.26};

function vec(ra, dec, r=R){ const raR = ra/24*Math.PI*2, dR = dec*Math.PI/180;
  return new THREE.Vector3( r*Math.cos(dR)*Math.cos(raR), r*Math.sin(dR), -r*Math.cos(dR)*Math.sin(raR) ); }
function ciColor(ci){ if(ci==null) return [0.80,0.84,0.92];
  if(ci<0)   return [0.67,0.75,1.0]; if(ci<0.3) return [0.81,0.85,1.0];
  if(ci<0.6) return [0.93,0.94,1.0]; if(ci<0.9) return [1.0,0.96,0.88];
  if(ci<1.3) return [1.0,0.85,0.63]; return [1.0,0.69,0.44]; }

// ── renderer / scene / camera ──────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas: cvs, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x02030a);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 4000);
camera.position.set(0,0,0);
let lon = 0.4, lat = 0.12;   // start facing Aries-ish
function aimCamera(){ const t = vec(0,0,10); // temp
  const dir = new THREE.Vector3(Math.cos(lat)*Math.cos(lon), Math.sin(lat), -Math.cos(lat)*Math.sin(lon));
  camera.lookAt(dir); }
function resize(){ renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
{ const c = zodiac[0]; if(c){ const v = vec(c.ra_center_hours, c.dec_center_degrees).normalize();
  lat = Math.asin(v.y); lon = Math.atan2(-v.z, v.x); } aimCamera(); }

// ── HYG star field: shader points, dimmable ────────────
const N = stars.length;
const pos = new Float32Array(N*3), col = new Float32Array(N*3), siz = new Float32Array(N);
stars.forEach((s,i)=>{ const v = vec(s.ra, s.dec); pos.set([v.x,v.y,v.z], i*3);
  const c = ciColor(s.ci); col.set(c, i*3);
  siz[i] = Math.max(0.9, 5.4 - s.mag*0.85); });
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
geo.setAttribute('color', new THREE.BufferAttribute(col,3));
geo.setAttribute('psize', new THREE.BufferAttribute(siz,1));
const starMat = new THREE.ShaderMaterial({
  uniforms: { uDim:{value:1.0}, uScale:{value:innerHeight/2} },
  vertexShader: `attribute float psize; attribute vec3 color; varying vec3 vC; varying float vS; uniform float uScale;
    void main(){ vC=color; vS=psize; vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize = psize * uScale / max(1.0,-mv.z) * 8.0; gl_Position = projectionMatrix*mv; }`,
  fragmentShader: `varying vec3 vC; varying float vS; uniform float uDim;
    void main(){ vec2 d=gl_PointCoord-.5; float r=length(d)*2.0;
      float a = smoothstep(1.0,0.15,r) * uDim * clamp(vS*0.5,0.25,1.0);
      gl_FragColor = vec4(vC, a); }`,
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending });
scene.add(new THREE.Points(geo, starMat));

// ── sprite helpers ─────────────────────────────────────
function textSprite(txt, {size=44, color='#e8c76a', font='Georgia', italic=false}={}){
  const pad=8, c=document.createElement('canvas'), x=c.getContext('2d');
  x.font = `${italic?'italic ':''}${size}px ${font}`;
  c.width = Math.ceil(x.measureText(txt).width)+pad*2; c.height = size+pad*2;
  x.font = `${italic?'italic ':''}${size}px ${font}`; x.textBaseline='middle';
  x.shadowColor='rgba(0,0,0,.9)'; x.shadowBlur=6; x.fillStyle=color;
  x.fillText(txt, pad, c.height/2);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy=2;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
  sp.scale.set(c.width/6, c.height/6, 1); return sp; }
function glowSprite(colorInner='rgba(232,199,106,1)', colorOuter='rgba(232,199,106,0)', px=64){
  const c=document.createElement('canvas'); c.width=c.height=px; const x=c.getContext('2d');
  const g=x.createRadialGradient(px/2,px/2,1,px/2,px/2,px/2);
  g.addColorStop(0,colorInner); g.addColorStop(1,colorOuter);
  x.fillStyle=g; x.fillRect(0,0,px,px);
  return new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(c), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending }); }

// ── groups / layers ────────────────────────────────────
const G = { band:new THREE.Group(), spine:new THREE.Group(), canon:new THREE.Group(),
            edges:new THREE.Group(), figures:new THREE.Group(), novae:new THREE.Group(), labels:new THREE.Group() };
Object.values(G).forEach(g=>scene.add(g));
const pickables = [];

// zodiacal band: ecliptic ring through the 12 centers + symbol sprites
{ const pts=[]; const loop=[...zodiac].sort((a,b)=>a.position-b.position);
  for(let i=0;i<loop.length;i++){ const a=loop[i], b=loop[(i+1)%loop.length];
    const va=vec(a.ra_center_hours,a.dec_center_degrees,R*0.985), vb=vec(b.ra_center_hours,b.dec_center_degrees,R*0.985);
    for(let k=0;k<10;k++){ pts.push(va.clone().lerp(vb,k/10).normalize().multiplyScalar(R*0.985)); } }
  pts.push(pts[0].clone());
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:0xa08a4a, transparent:true, opacity:0.35}));
  G.band.add(l);
  for(const r of zodiac){ const sp = textSprite(r.symbol, {size:64, color:'rgba(232,199,106,.95)'});
    sp.position.copy(vec(r.ra_center_hours, r.dec_center_degrees, R*0.96));
    sp.userData = { kind:'region', r }; G.band.add(sp); pickables.push(sp); } }

// Polaris — the one permanent label
{ const p = new THREE.Sprite(glowSprite('rgba(255,255,255,1)','rgba(232,199,106,0)'));
  p.scale.set(26,26,1); p.position.copy(vec(polaris.ra, polaris.dec, R*0.97));
  p.userData = { kind:'polaris' }; scene.add(p); pickables.push(p);
  const lab = textSprite('LOGOS*', {size:40}); lab.position.copy(vec(polaris.ra, polaris.dec-3.2, R*0.97)); scene.add(lab); }

// Septad spine on the ecliptic
{ const loop=[...zodiac].sort((a,b)=>a.position-b.position);
  function eclipticAt(t){ const n=loop.length, f=t*n, i=Math.floor(f)%n, k=f-Math.floor(f);
    const a=loop[i], b=loop[(i+1)%n];
    return vec(a.ra_center_hours,a.dec_center_degrees).lerp(vec(b.ra_center_hours,b.dec_center_degrees),k).normalize(); }
  const texFor = (name)=>{ const c=document.createElement('canvas'); c.width=128;c.height=64; const x=c.getContext('2d');
    const base={Moon:['#d8dbe2','#8f93a0'],Mercury:['#cfc6ba','#6f6a60'],Venus:['#f4e3c0','#c9a86a'],
                Mars:['#e8a074','#a04a2a'],Jupiter:['#e8d6b8','#b08a5a'],Saturn:['#efe0bb','#b39a62']}[name]||['#ccc','#777'];
    const g=x.createLinearGradient(0,0,0,64); g.addColorStop(0,base[0]); g.addColorStop(1,base[1]);
    x.fillStyle=g; x.fillRect(0,0,128,64);
    if(name==='Jupiter'){ x.fillStyle='rgba(150,105,60,.55)'; for(const y of [14,30,46]) x.fillRect(0,y,128,6); }
    if(name==='Moon'){ x.fillStyle='rgba(110,115,130,.5)'; for(const [px,py,r] of [[40,22,9],[80,40,7],[60,50,5]]){ x.beginPath();x.arc(px,py,r,0,7);x.fill(); } }
    return new THREE.CanvasTexture(c); };
  substrates.forEach((s,i)=>{ const dir = eclipticAt((i+0.5)/substrates.length);
    const p = dir.multiplyScalar(R*0.9);
    let body;
    if(s.planet==='Sun'){ body = new THREE.Sprite(glowSprite('rgba(255,240,200,1)','rgba(255,170,60,0)',128)); body.scale.set(120,120,1); }
    else { body = new THREE.Mesh(new THREE.SphereGeometry(s.planet==='Jupiter'?26:(s.planet==='Saturn'?22:16), 24, 16),
             new THREE.MeshBasicMaterial({ map: texFor(s.planet) })); }
    body.position.copy(p); body.userData = { kind:'planet', s };
    G.spine.add(body); pickables.push(body);
    if(s.planet==='Saturn'){ const ring = new THREE.Mesh(new THREE.RingGeometry(30,44,48),
        new THREE.MeshBasicMaterial({color:0xdcc896, side:THREE.DoubleSide, transparent:true, opacity:.7}));
      ring.position.copy(p); ring.lookAt(0,0,0); ring.rotateX(0.5); G.spine.add(ring); }
    const sym = textSprite(s.symbol, {size:52, color:'#dfe6f0'});
    sym.position.copy(p.clone().normalize().multiplyScalar(R*0.9).add(new THREE.Vector3(0,38,0)));
    G.spine.add(sym); }); }

// canon stars — gold glows, hover-only titles (M1 label sprites toggleable)
const canonSprites = [];
{ const matM1 = glowSprite('rgba(253,243,208,1)','rgba(232,199,106,0)');
  for(const t of canon){ const d=t.target_star_designation;
    const sp = new THREE.Sprite(matM1.clone());
    const M = t.magnitude_class;
    const s = M==='primary_canon_star_M1'?30:(M==='secondary_canon_star_M2'?20:14);
    sp.scale.set(s,s,1); sp.position.copy(vec(d.ra,d.dec,R*0.99));
    sp.userData = { kind:'canon', t };
    G.canon.add(sp); pickables.push(sp); canonSprites.push(sp);
    if(M==='primary_canon_star_M1'){ const lab = textSprite(t.title.length>30?t.title.slice(0,28)+'…':t.title, {size:30});
      lab.position.copy(vec(d.ra,d.dec-1.8,R*0.99)); lab.visible=false; G.labels.add(lab); } } }

// arcs
function arc(a, b, mat, dashed=false){ const va=vec(a.ra,a.dec).normalize(), vb=vec(b.ra,b.dec).normalize();
  const pts=[]; for(let k=0;k<=16;k++){ pts.push(va.clone().lerp(vb,k/16).normalize().multiplyScalar(R*0.988)); }
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const l = new THREE.Line(g, mat); if(dashed) l.computeLineDistances(); return l; }
{ const styles = {
    companion: new THREE.LineBasicMaterial({color:0xcfd6ea, transparent:true, opacity:.5}),
    chain_predecessor: new THREE.LineBasicMaterial({color:0xcfd6ea, transparent:true, opacity:.55}),
    bundle: new THREE.LineBasicMaterial({color:0xe8c76a, transparent:true, opacity:.16}),
    transform_of: new THREE.LineBasicMaterial({color:0xe8c76a, transparent:true, opacity:.6}),
    related: new THREE.LineDashedMaterial({color:0x7b86a0, transparent:true, opacity:.4, dashSize:8, gapSize:10}),
    predecessor: new THREE.LineDashedMaterial({color:0x7b86a0, transparent:true, opacity:.5, dashSize:5, gapSize:7}),
    superseded_by: new THREE.LineDashedMaterial({color:0x7b86a0, transparent:true, opacity:.25, dashSize:4, gapSize:9}) };
  for(const e of edges){ const A=canonById[e.source].target_star_designation, B=canonById[e.target].target_star_designation;
    const m = styles[e.kind]||styles.related;
    G.edges.add(arc(A,B,m, m.isLineDashedMaterial)); } }

// figures
{ const m = new THREE.LineDashedMaterial({color:0xe8c76a, transparent:true, opacity:.45, dashSize:10, gapSize:9});
  for(const f of figures){ for(const [a,b] of (f.lines||[])){ const A=canonById[a],B=canonById[b]; if(!A||!B) continue;
      G.figures.add(arc(A.target_star_designation,B.target_star_designation,m,true)); }
    const members=(f.member_texts||[]).map(id=>canonById[id]).filter(Boolean);
    if(members.length){ const c=members.reduce((s,t)=>s.add(vec(t.target_star_designation.ra,t.target_star_designation.dec).normalize()),new THREE.Vector3()).normalize();
      const lab = textSprite(f.name+(f.status!=='sealed'?' (proposed)':''), {size:34, italic:true});
      lab.position.copy(c.multiplyScalar(R*0.94)); G.figures.add(lab); } } }

// novae
const novaSprites = [];
{ const m = (()=>{ const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d');
    x.strokeStyle='rgba(255,120,90,1)'; x.lineWidth=4; x.beginPath(); x.arc(32,32,24,0,7); x.stroke();
    return new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending}); })();
  for(const ev of events){ const t = ev.source_text && canonById[ev.source_text];
    const p = t ? vec(t.target_star_designation.ra, t.target_star_designation.dec, R*0.985)
                : vec(polaris.ra, polaris.dec-5, R*0.985);
    const sp = new THREE.Sprite(m.clone()); sp.position.copy(p);
    sp.userData = { kind:'nova', ev, ph: Math.random() };
    G.novae.add(sp); pickables.push(sp); novaSprites.push(sp); } }

// ── controls: drag rotate · wheel/pinch fov · dim slider ──
let dragging=null; const pinchPts=new Map(); let pinchD=0;
cvs.addEventListener('pointerdown', e=>{ cvs.setPointerCapture(e.pointerId);
  pinchPts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinchPts.size===2){ pinchD=pd(); dragging=null; } else dragging={x:e.clientX,y:e.clientY,moved:false};
  cvs.classList.add('dragging'); });
function pd(){ const p=[...pinchPts.values()]; return Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]); }
cvs.addEventListener('pointermove', e=>{
  if(pinchPts.has(e.pointerId)) pinchPts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pinchPts.size===2){ const d=pd(); camera.fov=THREE.MathUtils.clamp(camera.fov*(pinchD/d),18,95); camera.updateProjectionMatrix(); pinchD=d; return; }
  if(dragging){ const k = camera.fov/60 * 0.0032;
    const dx=e.clientX-dragging.x, dy=e.clientY-dragging.y;
    if(Math.abs(dx)+Math.abs(dy)>3) dragging.moved=true;
    lon += dx*k; lat = THREE.MathUtils.clamp(lat + dy*k, -1.55, 1.55);
    dragging.x=e.clientX; dragging.y=e.clientY; aimCamera(); }
  else hover(e); });
cvs.addEventListener('pointerup', e=>{ pinchPts.delete(e.pointerId);
  cvs.classList.remove('dragging');
  if(dragging && !dragging.moved) pick(e, true);
  dragging=null; });
cvs.addEventListener('wheel', e=>{ e.preventDefault();
  camera.fov = THREE.MathUtils.clamp(camera.fov*Math.exp(e.deltaY*0.0011), 18, 95);
  camera.updateProjectionMatrix(); }, {passive:false});

const ray = new THREE.Raycaster(); const ptr = new THREE.Vector2();
function pick(e, select){ ptr.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(pickables, false);
  const h = hits[0] && hits[0].object;
  if(!h){ if(select) panel.classList.remove('open'); hideTip(); return null; }
  if(select) openFor(h.userData); else tipFor(h.userData, e);
  return h; }
function hover(e){ pick(e, false); }
function tipFor(u, e){ let html='';
  if(u.kind==='canon'){ const t=u.t; html=`<b style="color:#e8c76a">${t.title}</b><br>${t.author_heteronym||''}`; }
  else if(u.kind==='planet'){ const s=u.s; html=`<b style="color:#e8c76a">${s.symbol} ${s.office}</b> · ${s.substrate}`; }
  else if(u.kind==='region'){ const r=u.r; html=`<b style="color:#e8c76a">${r.symbol} ${r.sign}</b> — ${r.heteronym}`; }
  else if(u.kind==='nova'){ const ev=u.ev; html=`<b style="color:#ff8a6a">cast</b> · ${(ev.date||'').slice(0,10)}`; }
  else if(u.kind==='polaris'){ html=`<b style="color:#e8c76a">Jack Feist · LOGOS*</b><br>the pole that makes the cycle a cycle`; }
  if(html){ tip.innerHTML=html; tip.style.display='block';
    tip.style.left=Math.min(e.clientX+14, innerWidth-270)+'px'; tip.style.top=Math.min(e.clientY+14, innerHeight-60)+'px'; }
  else hideTip(); }
function hideTip(){ tip.style.display='none'; }
function openFor(u){ let html='';
  if(u.kind==='canon'){ const t=u.t, d=t.target_star_designation;
    html=`<div class="kind">Canon Star</div><h2>${t.title}</h2>
      <div class="row"><b>Heteronym</b>${t.author_heteronym||'—'}</div>
      <div class="row"><b>Star</b>${d.name||[d.bayer,d.con].filter(Boolean).join(' ')||'—'} · RA ${d.ra.toFixed(2)}h · Dec ${d.dec.toFixed(1)}° · mag ${d.mag}</div>
      <div class="row"><b>Assignment</b>${t.sky_assignment_basis||''}</div>
      ${t.anchor_for_room?`<div class="row"><b>Room anchor</b>${t.anchor_for_room}</div>`:''}
      <div class="links"><a href="/?sigil=${encodeURIComponent(t.id)}">Read with Sigil →</a></div>`; }
  else if(u.kind==='planet'){ const s=u.s;
    html=`<div class="kind">Substrate · Septad</div><h2>${s.symbol} ${s.planet} — ${s.office}</h2>
      <div class="row"><b>Substrate</b>${s.substrate}</div><div class="row"><b>Function</b>${s.function||''}</div>`; }
  else if(u.kind==='region'){ const r=u.r;
    const portrait = r.portrait_url_120 ? `<div style="margin:8px 0"><img src="${r.portrait_url_120}" alt="${r.heteronym} — portrait" style="width:120px;height:120px;border-radius:4px;border:1px solid var(--line);display:block"></div>` : (r.no_portrait_reason ? `<div style="margin:8px 0;padding:8px 10px;border:1px dashed var(--line);border-radius:4px;font-size:11px;color:var(--dim);line-height:1.4">${r.no_portrait_reason}</div>` : '');
    const portrait_alt = r.portrait_url_120_alt ? `<div style="margin:6px 0"><img src="${r.portrait_url_120_alt}" alt="${r.heteronym} — secondary portrait" style="width:120px;height:120px;border-radius:4px;border:1px solid var(--line);display:block"><div style="font-size:10px;color:var(--dim);letter-spacing:.06em;margin-top:2px;text-transform:uppercase">Also: secondary photo (Sep 21 2025 blog post)</div></div>` : '';
    html=`<div class="kind">Zodiacal Region · Position ${r.position}</div><h2>${r.symbol} ${r.sign} — ${r.heteronym}</h2>
      ${portrait}${portrait_alt}
      <div class="row"><b>Discipline</b>${r.discipline||'(awaiting adjudication)'}</div>`; }
  else if(u.kind==='nova'){ const ev=u.ev;
    html=`<div class="kind">Stellar Event · Cast</div><h2>Nova — ${(ev.date||'').slice(0,10)}</h2>
      <div class="row"><b>Mode</b>${ev.mode||''}</div>
      <div class="row"><b>Source</b>${ev.source_text ? (canonById[ev.source_text]||{}).title : 'unanchored (pole locus)'}</div>
      ${ev.axn?`<div class="row"><b>Record</b>${ev.axn}</div>`:''}`; }
  else if(u.kind==='polaris'){ html=`<div class="kind">The Pole</div><h2>Jack Feist · LOGOS*</h2>
      <div style="margin:8px 0"><img src="https://www.alexanarch.org/datasets/heteronyms/avatars/120/jack-feist.webp" alt="Jack Feist — portrait" style="width:120px;height:120px;border-radius:4px;border:1px solid var(--line);display:block"></div>
      <div class="row">Outside the twelve — the axis around which the zodiac rotates. The pole star is what makes the cycle a cycle.</div>`; }
  if(html){ panelBody.innerHTML=html; panel.classList.add('open'); } }

// ── HUD: toggles + dim + labels ────────────────────────
const ctl = document.getElementById('ctl');
const TOGGLES = [['band','Band',G.band],['spine','Septad',G.spine],['canon','Canon',G.canon],
                 ['edges','Edges',G.edges],['figures','Figures',G.figures],['novae','Novae',G.novae],['labels','M1 Labels',G.labels]];
for(const [k,name,grp] of TOGGLES){ const on = k!=='labels';
  grp.visible = on;
  const lab=document.createElement('label'); lab.className=on?'on':'';
  const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=on;
  cb.onchange=()=>{ grp.visible=cb.checked; lab.className=cb.checked?'on':'';
    if(k==='labels') G.labels.children.forEach(c=>c.visible=cb.checked); };
  lab.append(cb, name); ctl.append(lab); }
const dimrow=document.createElement('div'); dimrow.id='dimrow';
dimrow.innerHTML='<span>DIM</span><input id="dim" type="range" min="10" max="170" value="100"><span>BRIGHT</span>';
ctl.append(dimrow);
document.getElementById('dim').addEventListener('input', e=>{ starMat.uniforms.uDim.value = e.target.value/100; });

// ── loop ───────────────────────────────────────────────
const clock = new THREE.Clock();
function loop(){ const t = clock.getElapsedTime();
  for(const sp of novaSprites){ const ph=(t*0.35 + sp.userData.ph)%1;
    const s = 10 + ph*26; sp.scale.set(s,s,1); sp.material.opacity = 0.75*(1-ph); }
  renderer.render(scene, camera);
  requestAnimationFrame(loop); }
starMat.uniforms.uScale.value = innerHeight/2;
addEventListener('resize', ()=>{ starMat.uniforms.uScale.value = innerHeight/2; });
document.getElementById('loading').style.opacity=0;
setTimeout(()=>document.getElementById('loading').remove(), 700);
loop();
</script>
