name: Regenerate RAG and Sky

on:
  # Run on pushes to main that change scripts, submodule, or workflow
  push:
    branches: [main]
    paths:
      - 'scripts/regenerate_rag.py'
      - 'scripts/regenerate_sky.py'
      - 'requirements.txt'
      - '.github/workflows/regenerate-rag.yml'
      - 'alexanarch'  # submodule pointer changes

  # Allow manual trigger
  workflow_dispatch:

  # Weekly cron in case alexanarch advances without us noticing (Sunday 03:00 UTC)
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write  # need to commit regenerated rag/*.json and sky/*.json back to repo

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Update alexanarch submodule to latest main
        run: |
          cd alexanarch
          git fetch origin
          git checkout origin/main
          cd ..

      - name: Regenerate RAG index
        run: python scripts/regenerate_rag.py

      - name: Regenerate sky data
        run: python scripts/regenerate_sky.py

      - name: Check for changes
        id: check
        run: |
          if [ -n "$(git status --porcelain rag/ sky/ alexanarch)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push regenerated artifacts
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rag/ sky/ alexanarch
          git commit -m "regenerate: RAG + sky — $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Triggered by ${{ github.event_name }}.
          Corpus hash: $(jq -r .corpus_hash rag/config.json)
          Deposit count: $(jq -r .deposit_count rag/config.json)
          Inscriptions: $(jq -r .counts.inscriptions sky/config.json)
          Edges: $(jq -r .counts.edges sky/config.json)"
          git push

# ── Cadence note (2026-08-15) ────────────────────────────────────────────────
# This runs weekly (Sunday 03:00 UTC). Between runs, Sigil reasons over a corpus
# that is up to seven days behind alexanarch — by design, not by fault. On
# 2026-08-15 the index held 1,437 deposits against the archive's 1,486: the
# pointer was pinned at the 2026-08-09 04:19 run and 49 deposits, including that
# day's principal work, were outside Sigil's knowledge.
#
# The RAG build is faithful to its input; the input is a submodule pointer that
# only advances inside this job. So "is the knowledge base current?" is really
# "when did this last run?" — and nothing surfaces that. If same-day currency is
# wanted, either raise the cadence or dispatch this workflow after a mint.
